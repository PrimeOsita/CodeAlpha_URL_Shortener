<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URL Shortener</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🔗 URL Shortener</h1>
      <div id="authStatus" class="auth-status"></div>
    </header>
    <section class="card">
      <form id="shortenForm">
        <label for="longUrl">Long URL</label>
        <input type="url" id="longUrl" placeholder="https://example.com/very/long/path" required />

        <label for="customCode">Custom code (optional)</label>
        <input type="text" id="customCode" placeholder="my-link" />

        <button type="submit">Shorten</button>
      </form>
      <p id="formError" class="error"></p>

      <div id="result" class="result hidden">
        <span>Your short URL:</span>
        <a id="resultLink" href="#" target="_blank"></a>
        <button id="copyBtn">Copy</button>
      </div>
    </section>

    <section class="card" id="authCard">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Log in</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <form id="loginForm" class="tab-panel active">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required />
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required />
        <button type="submit">Log in</button>
      </form>

      <form id="registerForm" class="tab-panel">
        <label for="registerName">Name</label>
        <input type="text" id="registerName" required />
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" required />
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" required minlength="6" />
        <button type="submit">Register</button>
      </form>

      <p id="authError" class="error"></p>
      <button id="logoutBtn" class="hidden">Log out</button>
    </section>

    <section class="card hidden" id="myUrlsCard">
      <h2>My URLs</h2>
      <ul id="urlList"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
